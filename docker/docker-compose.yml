services:
  postgres:
    image: postgres:16-alpine
    container_name: assessment_postgres
    environment:
      POSTGRES_USER: assessment_user
      POSTGRES_PASSWORD: assessment_pass
      POSTGRES_DB: assessment_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment_user -d assessment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assessment_redis
    ports:
      - "6380:6379"   # host 6380 — 6379 is often taken by other dev Redis containers
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional — only if VECTOR_STORE_BACKEND=qdrant in backend/.env (default is FAISS)
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:latest
    container_name: assessment_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
